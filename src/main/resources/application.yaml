server:
  port: 8080

spring:
  application:
    name: zhiyin-campus
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://192.168.123.128/zhiyin-campus
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 192.168.123.128
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

mybatis-plus:
  type-aliases-package: cn.redture
  configuration:
    default-enum-type-handler: cn.redture.campus.util.PgEnumTypeHandler # 自定义枚举处理器
logging:
  level:
    cn.redture: debug
  file:
    path: ./logs

jwt:
  secret: ai-social-project-secret-key-for-jwt-authentication-hs256-20240520
  access_token_expiration: 900 # 15 minutes in seconds
  refresh_token_expiration_seconds: 604800 # 7 days in seconds

campus:
  rag:
    storage:
      provider: pgvector
      local-file-dir: ./data/knowledge
    qwen:
      api-key: ${Qwen-Api:}
      base-url: ${DASHSCOPE_BASE_URL:}
      chat-model: deepseek-v4-flash
      embedding-model: text-embedding-v4
      embedding-dimension: 1024
      temperature: 0.2
      top-p: 0.8
      max-tokens: 1600
    chunking:
      strategy: parent_child
      chunk-size: 800
      overlap: 120
      parent-size: 1200
      child-size: 400
    retrieval:
      vector-top-k: 20
      bm25-top-k: 20
      final-top-k: 5
      rrf-k: 60
      rerank-threshold: 0.1
