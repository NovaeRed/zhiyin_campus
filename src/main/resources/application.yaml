server:
  port: 8081
spring:
  config:
    import: optional:file:./application-local.yaml
  application:
    name: zhiyin-campus
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
      username: ${REDIS_USERNAME}
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: cn.redture
  configuration:
    default-enum-type-handler: cn.redture.campus.util.PgEnumTypeHandler
logging:
  level:
    cn.redture: info
  file:
    path: ./logs
jwt:
  secret: ${JWT_SECRET}
  access_token_expiration: 900
  refresh_token_expiration_seconds: 604800
campus:
  rag:
    storage:
      provider: pgvector
      local-file-dir: ./data/knowledge
    qwen:
      api-key: ${Qwen-Api:}
      base-url: ${DASHSCOPE_BASE_URL:}
      chat-model: deepseek-v4-flash-0731
      embedding-model: qwen3.7-text-embedding-flash
      embedding-dimension: 1024
      temperature: 0.2
      top-p: 0.8
      max-tokens: 1600
    chunking:
      strategy: parent_child
      chunk-size: 800
      overlap: 120
      parent-size: 1200
      child-size: 400
    retrieval:
      vector-top-k: 20
      bm25-top-k: 20
      final-top-k: 5
      rrf-k: 60
      rerank-threshold: 0.1
